[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truenas_ng"
version = "0.1.0"
description = "TrueNAS (Native) — Home Assistant custom integration for TrueNAS 26 over JSON-RPC 2.0 WebSocket"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
authors = [{ name = "japatton" }]

[project.optional-dependencies]
test = [
  "pytest-homeassistant-custom-component==0.13.330",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools]
packages = ["custom_components.truenas_ng"]
